name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:

  run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Check diff
      run: git diff --check

    - name: Check for Telegram tokens
      run: '! git grep -nE "[0-9]{8,12}:AA[A-Za-z0-9_-]{20,}" -- . ":!.env.example"'

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    - name: Race test
      run: go test -race ./...

    - name: Build
      run: go build ./...

